name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CSPROJ: Source/DubheTech/DubheTech.csproj

jobs:
  quality:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: ${{ env.CSPROJ }}
      - name: Build (Release)
        run: dotnet build Source/DubheTech.sln -c Release

  release:
    name: Package and publish
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 更新日志需要完整提交历史与已有 tag
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: ${{ env.CSPROJ }}

      - name: Resolve version
        id: version
        run: |
          base=$(grep -oP '(?<=<Version>)[^<]+' "$CSPROJ" | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            prerelease=false
          else
            version="${base}+snapshot.${GITHUB_RUN_NUMBER}"
            tag="v${version}"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Build with resolved version
        run: dotnet build Source/DubheTech.sln -c Release -p:Version="${{ steps.version.outputs.version }}"

      - name: Package mod zip
        run: |
          version="${{ steps.version.outputs.version }}"
          staging=.pkg/DubheTech
          mkdir -p "$staging"
          cp -r About Assemblies Defs Languages Textures "$staging/"
          find "$staging" -name .gitkeep -delete
          (cd .pkg && zip -r -q "../DubheTech-v${version}.zip" DubheTech)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DubheTech-v${{ steps.version.outputs.version }}
          path: DubheTech-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Collect commit changelog
        run: |
          tag="${{ steps.version.outputs.tag }}"
          prev=$(git tag -l 'v*' --sort=-creatordate | grep -vx "$tag" | head -1 || true)
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "## 更新日志"
            echo
            git log --no-merges --pretty=format:'- %s' $range
            echo
            echo
            echo "## 文件"
            echo
            echo "- [DubheTech-v${{ steps.version.outputs.version }}.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/DubheTech-v${{ steps.version.outputs.version }}.zip)"
          } > notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          zip="DubheTech-v${{ steps.version.outputs.version }}.zip"
          prerelease="${{ steps.version.outputs.prerelease }}"
          args=(--title "$tag" --notes-file notes.md)
          if [ "$prerelease" = "true" ]; then
            args+=(--prerelease)
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            # 同一次运行重试：tag 由 run number 决定，必然唯一，直接覆盖附件与说明
            gh release upload "$tag" "$zip" --clobber
            gh release edit "$tag" "${args[@]}"
          else
            if [ "$prerelease" = "true" ]; then
              # 分支构建的 tag 尚不存在，显式指向本次提交的 sha
              args+=(--target "$GITHUB_SHA")
            fi
            gh release create "$tag" "$zip" "${args[@]}"
          fi

  dump-version:
    name: Dump version into project
    needs: release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 版本号落盘的提交要落到 tag 所在的分支
          ref: main
      - name: Write tag version into csproj
        run: |
          version="${{ needs.release.outputs.version }}"
          sed -i "s|<Version>[^<]*</Version>|<Version>${version}</Version>|" "$CSPROJ"
          grep -oP '(?<=<Version>)[^<]+' "$CSPROJ"
      - name: Commit and push version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CSPROJ"
          if git diff --cached --quiet; then
            echo "csproj 版本已是 ${version}，无需提交"
            exit 0
          fi
          git commit -m "chore(release): 落盘版本号 ${version}"
          # 由 GITHUB_TOKEN 推送的提交不会再触发工作流，不会递归发布
          git push origin main
